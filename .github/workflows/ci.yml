name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Run Tests
        run: go test ./... -cover


      - name: Exit
        run: (exit 0)

  Style:
    name: Style 
    runs-on: ubuntu-latest

    steps:
      - name: Fmt Formatinng
        run: test -z $(go fmt ./...)

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest  echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Static Check
        run: staticcheck ./...
      
      

